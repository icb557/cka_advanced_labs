apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver-controlplane
  namespace: kube-system
  labels:
    component: kube-apiserver
spec:
  hostNetwork: true
  containers:
  - name: kube-apiserver
    image: registry.k8s.io/kube-apiserver:v1.37.0
    command:
    - kube-apiserver
    - --advertise-address=10.0.0.10
    - --secure-port=6443
    - --definitely-not-a-real-apiserver-flag=true
